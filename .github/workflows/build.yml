name: Build
on:
  push:
    branches:
      - master
    tags:
      - '[0-9][0-9].[0-9][0-9]'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install container prerequisites
        run: |
          apt update
          apt install -y sudo git ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache gcc-riscv64-linux-gnu g++-riscv64-linux-gnu libglx-dev libgl-dev libvulkan-dev libwayland-dev libx11-dev nasm curl cmake build-essential xxd pkg-config autoconf
          sudo cp -r /usr/include/GL /usr/local/include/GL
          sudo cp -r /usr/include/vulkan /usr/local/include/vulkan
          sudo cp -r /usr/include/X11 /usr/local/include/X11
          sudo cp -r /usr/include/KHR /usr/local/include/KHR
          sudo cp -r /usr/include/vk_video /usr/local/include/vk_video
      - name: Configure
        run: |
          EXTRA_FLAGS=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            EXTRA_FLAGS="-DFELIX86_MONTHLY_RELEASE=1"
          fi
          cmake -B $GITHUB_WORKSPACE/build -DBUILD_TESTS=1 -DBUILD_LATENCY_MEASURER=1 -DCMAKE_TOOLCHAIN_FILE=riscv.cmake -DFELIX86_BUILD_THUNKING=1 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release $EXTRA_FLAGS
      - name: Build
        run: |
          cmake --build $GITHUB_WORKSPACE/build -j$(nproc)
      - name: Configure thunk libs
        run: |
          cmake -S $GITHUB_WORKSPACE/src/felix86/hle/guest_libs -B $GITHUB_WORKSPACE/src/felix86/hle/guest_libs/build
      - name: Build thunk libs
        run: |
          cmake --build $GITHUB_WORKSPACE/src/felix86/hle/guest_libs/build -j$(nproc)
      - name: Prepare artifact
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifact
          mkdir -p $GITHUB_WORKSPACE/artifact/lib
          cp $GITHUB_WORKSPACE/build/felix86 $GITHUB_WORKSPACE/artifact/
          riscv64-linux-gnu-strip --strip-debug $GITHUB_WORKSPACE/artifact/felix86
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            curl -fsSL -o $GITHUB_WORKSPACE/artifact/felix86.png https://cdn.felix86.com/images/felix86.png
            echo "a35e3508794644729aee70bfd7ee3a6e041eb63da7c2724d920e6fe5756d29a0  $GITHUB_WORKSPACE/artifact/felix86.png" | sha256sum -c -
          fi
          mv $GITHUB_WORKSPACE/src/felix86/hle/guest_libs/build/x86_64-linux-gnu $GITHUB_WORKSPACE/artifact/lib
          mkdir -p $GITHUB_WORKSPACE/test
          cp $GITHUB_WORKSPACE/build/felix86_test $GITHUB_WORKSPACE/test/
          cp $GITHUB_WORKSPACE/build/felix86_latency_measurer $GITHUB_WORKSPACE/test/
          cp $GITHUB_WORKSPACE/build/felix86 $GITHUB_WORKSPACE/test/
          cp -r $GITHUB_WORKSPACE/build/ASM $GITHUB_WORKSPACE/test/
          cp -r $GITHUB_WORKSPACE/build/32Bit_ASM $GITHUB_WORKSPACE/test/
          cp -r $GITHUB_WORKSPACE/build/Binaries $GITHUB_WORKSPACE/test/
      - name: Upload
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: linux_artifact
          path: artifact
      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: test_artifact
          path: test
          retention-days: 1
  instruction_counter:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install container prerequisites
        run: |
          apt update
          apt install -y sudo git ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake libxbyak-dev nasm xxd autoconf
      - name: Configure
        run: cmake -B $GITHUB_WORKSPACE/build_counter -DBUILD_INSTRUCTION_COUNTER=ON -DFELIX86_BUILD_THUNKING=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build $GITHUB_WORKSPACE/build_counter --target felix86_instruction_counter -j$(nproc)
      - name: Run instruction counter
        run: $GITHUB_WORKSPACE/build_counter/felix86_instruction_counter
      - name: Check for differences
        run: git diff --exit-code counts/
  test:
    needs: [build, instruction_counter]
    runs-on: bpi-f3
    steps:
      - name: Download main artifact
        uses: actions/download-artifact@v5
        with:
          name: linux_artifact
          path: ${{ github.workspace }}/artifact
      - name: Download test artifact
        uses: actions/download-artifact@v5
        with:
          name: test_artifact
          path: ${{ github.workspace }}/test
      - name: Test
        run: |
          # We don't update the binfmt_misc installation so don't use it while running tests
          export FELIX86_BINFMT_MISC_INSTALLED=0
          chmod +x ${{ github.workspace }}/test/felix86_test
          chmod +x ${{ github.workspace }}/test/felix86
          ${{ github.workspace }}/test/felix86_test
          FELIX86PATH="${{ github.workspace }}/test/felix86"
          ROOTFSPATH=$($FELIX86PATH --get-config general.rootfs_path)
          git clone https://github.com/felix86-emu/binary_tests $RUNNER_TEMP/tests
          cd $RUNNER_TEMP/tests
          FELIX86_GLIBC_LINK="https://github.com/felix86-emu/glibc/releases/download/2.4.3-felix86/glibc-felix86.zip"
          curl -fsSL "$FELIX86_GLIBC_LINK" -o "$RUNNER_TEMP/tests/glibc.zip"
          unzip -o -d "$RUNNER_TEMP/tests" "$RUNNER_TEMP/tests/glibc.zip"
          patchelf --set-interpreter "$RUNNER_TEMP/tests/lib/riscv64-linux-gnu/ld-linux-riscv64-lp64d.so.1" --add-rpath "$RUNNER_TEMP/tests/lib/riscv64-linux-gnu" "$FELIX86PATH"
          bash ./install-tests.sh $HOME/felix86_test_binaries
          bash ./run-tests.sh $FELIX86PATH $HOME/felix86_test_binaries

  latency:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test]
    runs-on: bpi-f3
    steps:
      - name: Create bot token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.LATENCY_APP_ID }}
          private-key: ${{ secrets.LATENCY_APP_KEY }}
      - name: Check out latency results
        uses: actions/checkout@v4
        with:
          ref: latency-results
          token: ${{ steps.app.outputs.token }}
      - name: Download test artifact
        uses: actions/download-artifact@v5
        with:
          name: test_artifact
          path: ${{ github.workspace }}/test
      - name: Measure difference
        run: |
          export FELIX86_QUIET=1
          chmod +x ${{ github.workspace }}/test/felix86_latency_measurer
          ${{ github.workspace }}/test/felix86_latency_measurer
      - name: Commit latencies
        run: |
          git add latencies
          git diff --cached --quiet && exit 0
          git config user.name "Pebbles"
          git config user.email "327665220+felix86-latency[bot]@users.noreply.github.com"
          {
            echo "Update latencies for ${{ github.sha }}"
            echo
            echo
            echo "[skip ci]"
          } > $RUNNER_TEMP/commit_message.txt
          git commit -F $RUNNER_TEMP/commit_message.txt
          git pull --rebase origin latency-results
          git push origin HEAD:latency-results

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'nightly' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          aws-region: us-east-2
          allowed-account-ids: "562041964394"
      - name: Publish
        shell: bash
        env:
          KIND: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'nightly' }}
          BUCKET: felix86-builds
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_PUBKEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAm+MY5z6dHoXUd+m7VUKez4j3eZRSd/8W1xy0fdSe8zk=
            -----END PUBLIC KEY-----
          RELEASE_PUBKEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAyPmX409Bi6QkPYBCG5CKA8z0ODrSdwI/qhMHLX1SlHU=
            -----END PUBLIC KEY-----
        run: |
          set -euo pipefail

          die() { echo "Error: $*" >&2; exit 1; }

          [[ -n "$SIGNING_KEY" ]] || die "SIGNING_KEY is not set in the $KIND environment"
          [[ -n "$ARTIFACT_ID" && -n "$ARTIFACT_DIGEST" ]] || die "the build job did not report the artifact id and digest"

          case "$KIND" in
            nightly)
              [[ "$GITHUB_REF" == "refs/heads/master" ]] || die "nightly builds are only published from master"
              prefix="nightly"
              dir="builds/$RUN_ID"
              zip_cache="public, max-age=31536000, immutable"
              pubkey="$NIGHTLY_PUBKEY"
              ;;
            release)
              [[ "$GITHUB_REF" =~ ^refs/tags/[0-9]{2}\.[0-9]{2}$ ]] || die "releases are only published from NN.NN tags"
              version="${GITHUB_REF#refs/tags/}"
              prefix="releases"
              dir="$version"
              zip_cache="public, max-age=300"
              pubkey="$RELEASE_PUBKEY"
              ;;
            *)
              die "unknown kind: $KIND"
              ;;
          esac

          key="$RUNNER_TEMP/signing-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
          unset SIGNING_KEY

          work="$RUNNER_TEMP/publish"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"

          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > felix86.zip
          unset GH_TOKEN
          expected="${ARTIFACT_DIGEST#sha256:}"
          sha256=$(sha256sum felix86.zip | cut -d' ' -f1)
          [[ "$sha256" == "$expected" ]] || die "artifact changed after the build job: build reported $expected, downloaded $sha256"

          openssl pkeyutl -sign -rawin -inkey "$key" -in felix86.zip -out felix86.zip.sig
          rm -f "$key"
          printf '%s' "$pubkey" > key.pub
          openssl pkeyutl -verify -rawin -pubin -inkey key.pub -in felix86.zip -sigfile felix86.zip.sig >/dev/null \
            || die "the SIGNING_KEY of the $KIND environment is not the $KIND key"

          aws s3api get-object --bucket "$BUCKET" --key "$prefix/index.json" index.old.json >/dev/null
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [[ "$KIND" == "nightly" ]]; then
            cutoff=$(date -u -d '-80 days' +%s)
            jq --argjson run "$RUN_ID" --arg commit "$COMMIT" --arg date "$now" --arg sha "$sha256" \
               --arg path "$dir/felix86.zip" --argjson cutoff "$cutoff" '
              .builds = (
                [{run_id: $run, commit: $commit, date: $date, sha256: $sha, path: $path}]
                + [.builds[] | select(.run_id != $run and (.date | fromdateiso8601) >= $cutoff)]
              )' index.old.json > index.json
          else
            jq --arg version "$version" --argjson run "$RUN_ID" --arg commit "$COMMIT" --arg date "$now" \
               --arg sha "$sha256" --arg path "$dir/felix86.zip" '
              .releases = (
                [.releases[] | select(.version != $version)]
                + [{version: $version, run_id: $run, commit: $commit, date: $date, sha256: $sha, path: $path}]
                | sort_by(.version) | reverse
              )' index.old.json > index.json
          fi

          aws s3 cp felix86.zip "s3://$BUCKET/$prefix/$dir/felix86.zip" \
            --content-type application/zip --cache-control "$zip_cache"
          aws s3 cp felix86.zip.sig "s3://$BUCKET/$prefix/$dir/felix86.zip.sig" \
            --content-type application/octet-stream --cache-control "$zip_cache"
          aws s3 cp index.json "s3://$BUCKET/$prefix/index.json" \
            --content-type application/json --cache-control "max-age=60"
          echo "Published $KIND build $sha256 to $prefix/$dir"
