name: Build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu libglx-dev libgl-dev libvulkan-dev libx11-dev
          mkdir our_include
          cp /usr/include/GL/glx.h our_include/
          cp /usr/include/GL/gl.h our_include/
          cp /usr/include/vulkan/vulkan.h our_include/
          cp /usr/include/X11/Xlibint.h our_include/
      - name: Configure
        run: |
          cmake -B build -DBUILD_TESTS=1 -DCMAKE_CXX_FLAGS="./our_include" -DCMAKE_C_FLAGS="./our_include"  -DCMAKE_TOOLCHAIN_FILE=riscv.cmake -DBUILD_THUNKING=1 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build build -j$(nproc)
      - name: Prepare artifact
        run: |
          mkdir -p ./artifact
          mkdir -p ./artifact/lib
          cp ./build/felix86 ./artifact/
          cp ./build/felix86-mounter ./artifact/
          cp ./src/felix86/hle/guest_libs/libGL.so.1 ./artifact/lib/
          cp ./src/felix86/hle/guest_libs/libEGL.so.1 ./artifact/lib/
          cp ./src/felix86/hle/guest_libs/libGLX.so.0 ./artifact/lib/
          cp ./src/felix86/hle/guest_libs/libvulkan.so.1 ./artifact/lib/
          cp ./src/felix86/hle/guest_libs/libwayland-client.so ./artifact/lib/
          cp ./src/felix86/hle/guest_libs/libluajit-5.1.so ./artifact/lib/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Linux executable
          path: ./artifact/